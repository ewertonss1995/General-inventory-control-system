<svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Inventory Control System</title>
  <desc id="desc">Diagrama da arquitetura do backend com clientes, API REST, camada de domínio, MongoDB, PostgreSQL, segurança e observabilidade.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cardPrimary" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardSecondary" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" x2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box { rx: 18; ry: 18; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="url(#bg)"/>
  <text x="700" y="60" text-anchor="middle" class="title">Inventory Control System</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">Arquitetura de backend com catálogo em MongoDB, estoque em PostgreSQL e segurança JWT</text>

  <rect x="55" y="140" width="240" height="130" class="box" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="185" text-anchor="middle" class="label">Clientes / Apps</text>
  <text x="175" y="215" text-anchor="middle" class="small">Web, Mobile ou integrações</text>
  <text x="175" y="242" text-anchor="middle" class="small">HTTP REST / JWT</text>

  <rect x="390" y="120" width="280" height="250" class="box" fill="url(#cardPrimary)" stroke="#0f172a" stroke-width="2"/>
  <text x="530" y="165" text-anchor="middle" fill="#f8fafc" class="label">API REST</text>
  <text x="530" y="195" text-anchor="middle" fill="#dbeafe" class="small">Controllers</text>
  <text x="530" y="220" text-anchor="middle" fill="#dbeafe" class="small">CategoryController</text>
  <text x="530" y="245" text-anchor="middle" fill="#dbeafe" class="small">ProductController</text>
  <text x="530" y="280" text-anchor="middle" fill="#dbeafe" class="small">DTOs / Validations /</text>
  <text x="530" y="305" text-anchor="middle" fill="#dbeafe" class="small">GlobalExceptionHandler</text>

  <rect x="760" y="120" width="280" height="250" class="box" fill="url(#cardSecondary)" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="165" text-anchor="middle" class="label">Camada de Aplicação</text>
  <text x="900" y="195" text-anchor="middle" class="small">Use Cases</text>
  <text x="900" y="220" text-anchor="middle" class="small">Create / Get / Update</text>
  <text x="900" y="245" text-anchor="middle" class="small">ProductService</text>
  <text x="900" y="270" text-anchor="middle" class="small">CategoryService</text>
  <text x="900" y="300" text-anchor="middle" class="small">Business Rules</text>
  <text x="900" y="325" text-anchor="middle" class="small">Stock validation</text>

  <rect x="1120" y="120" width="210" height="250" class="box" fill="url(#cardGreen)" stroke="#16a34a" stroke-width="2"/>
  <text x="1225" y="165" text-anchor="middle" class="label">MongoDB</text>
  <text x="1225" y="195" text-anchor="middle" class="small">products</text>
  <text x="1225" y="220" text-anchor="middle" class="small">categories</text>
  <text x="1225" y="250" text-anchor="middle" class="small">Documentos do</text>
  <text x="1225" y="275" text-anchor="middle" class="small">catálogo</text>
  <text x="1225" y="305" text-anchor="middle" class="small">Índices únicos</text>

  <rect x="390" y="440" width="300" height="220" class="box" fill="url(#cardOrange)" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="485" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="540" y="515" text-anchor="middle" class="small">tb_stock_balance</text>
  <text x="540" y="540" text-anchor="middle" class="small">tb_stock_movement</text>
  <text x="540" y="575" text-anchor="middle" class="small">Saldo do produto</text>
  <text x="540" y="600" text-anchor="middle" class="small">Ledger e auditoria</text>
  <text x="540" y="625" text-anchor="middle" class="small">Optimistic locking</text>

  <rect x="760" y="440" width="300" height="220" class="box" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="910" y="485" text-anchor="middle" class="label">Segurança / Infra</text>
  <text x="910" y="515" text-anchor="middle" class="small">JWT validation</text>
  <text x="910" y="540" text-anchor="middle" class="small">Roles: ADMIN / MANAGER / OPERATOR</text>
  <text x="910" y="575" text-anchor="middle" class="small">SecurityConfig</text>
  <text x="910" y="600" text-anchor="middle" class="small">CustomJwtAuthenticationConverter</text>
  <text x="910" y="625" text-anchor="middle" class="small">Beans / Metrics / Tracing</text>

  <rect x="1120" y="440" width="210" height="220" class="box" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1225" y="485" text-anchor="middle" class="label">Observabilidade</text>
  <text x="1225" y="515" text-anchor="middle" class="small">Actuator</text>
  <text x="1225" y="540" text-anchor="middle" class="small">/actuator/health</text>
  <text x="1225" y="565" text-anchor="middle" class="small">/actuator/prometheus</text>
  <text x="1225" y="600" text-anchor="middle" class="small">Micrometer</text>
  <text x="1225" y="625" text-anchor="middle" class="small">Tracing OTLP</text>

  <path class="line" d="M295 205 H390"/>
  <path class="line" d="M670 245 H760"/>
  <path class="line" d="M1040 245 H1120"/>
  <path class="line" d="M540 370 V440"/>
  <path class="line" d="M910 370 V440"/>
  <path class="line" d="M1225 370 V440"/>

  <path class="dashed" d="M760 520 H690"/>
  <path class="dashed" d="M690 520 L690 615 L760 615"/>

  <text x="700" y="760" text-anchor="middle" class="small">Fluxo de dados: Cliente → API REST → Casos de uso → Adaptadores → Bancos de dados e observabilidade</text>
</svg>
