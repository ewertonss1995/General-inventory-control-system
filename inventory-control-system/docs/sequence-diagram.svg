<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de sequência do Inventory Control System</title>
  <desc id="desc">Diagrama de sequência do cadastro de produto e atualização de estoque, mostrando interações entre cliente, controllers, serviços, bancos e validações.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .note { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
      .msg { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #16a34a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .client { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .controller { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
      .service { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .mongo { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .pg { fill: #ffedd5; stroke: #f59e0b; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="52" text-anchor="middle" class="title">Diagrama de sequência</text>

  <g>
    <rect x="70" y="95" width="120" height="60" class="client" rx="14"/>
    <text x="130" y="132" text-anchor="middle" class="label">Cliente</text>
    <line x1="130" y1="155" x2="130" y2="900" class="lifeline"/>

    <rect x="290" y="95" width="170" height="60" class="controller" rx="14"/>
    <text x="375" y="132" text-anchor="middle" class="label">ProductController</text>
    <line x1="375" y1="155" x2="375" y2="900" class="lifeline"/>

    <rect x="555" y="95" width="180" height="60" class="service" rx="14"/>
    <text x="645" y="132" text-anchor="middle" class="label">ProductService</text>
    <line x1="645" y1="155" x2="645" y2="900" class="lifeline"/>

    <rect x="835" y="95" width="170" height="60" class="mongo" rx="14"/>
    <text x="920" y="132" text-anchor="middle" class="label">MongoDB</text>
    <line x1="920" y1="155" x2="920" y2="900" class="lifeline"/>

    <rect x="1090" y="95" width="170" height="60" class="pg" rx="14"/>
    <text x="1175" y="132" text-anchor="middle" class="label">PostgreSQL</text>
    <line x1="1175" y1="155" x2="1175" y2="900" class="lifeline"/>

    <rect x="1330" y="95" width="155" height="60" class="box" rx="14"/>
    <text x="1407" y="132" text-anchor="middle" class="label">Resposta</text>
    <line x1="1407" y1="155" x2="1407" y2="900" class="lifeline"/>
  </g>

  <text x="800" y="200" text-anchor="middle" class="section">Cadastro de produto e saldo inicial</text>

  <path class="msg" d="M130 240 H375"/>
  <text x="250" y="228" text-anchor="middle" class="small">POST /v1/products/save</text>

  <path class="msg" d="M375 290 H645"/>
  <text x="510" y="278" text-anchor="middle" class="small">create(product)</text>

  <path class="msg" d="M645 340 H920"/>
  <text x="780" y="328" text-anchor="middle" class="small">find category / save product</text>

  <path class="reply" d="M920 395 H645"/>
  <text x="782" y="383" text-anchor="middle" class="small">product persisted</text>

  <path class="msg" d="M645 450 H1175"/>
  <text x="910" y="438" text-anchor="middle" class="small">INSERT tb_stock_balance</text>

  <path class="reply" d="M1175 510 H645"/>
  <text x="910" y="498" text-anchor="middle" class="small">saldo inicial criado</text>

  <path class="reply" d="M645 570 H375"/>
  <text x="510" y="558" text-anchor="middle" class="small">ProductResponse</text>

  <path class="reply" d="M375 620 H130"/>
  <text x="250" y="608" text-anchor="middle" class="small">201 Created</text>

  <text x="800" y="700" text-anchor="middle" class="section">Atualização de estoque</text>

  <path class="msg" d="M130 760 H375"/>
  <text x="250" y="748" text-anchor="middle" class="small">PATCH /v1/products/{sku}/stock</text>

  <path class="msg" d="M375 800 H645"/>
  <text x="510" y="788" text-anchor="middle" class="small">updateStock(sku, qty, type)</text>

  <path class="msg" d="M645 840 H1175"/>
  <text x="910" y="828" text-anchor="middle" class="small">SELECT saldo + validação IN/OUT</text>

  <path class="msg" d="M1175 885 H645"/>
  <text x="910" y="873" text-anchor="middle" class="small">saldo atual + commit</text>

  <path class="reply" d="M645 920 H375"/>
  <text x="510" y="908" text-anchor="middle" class="small">200 OK / StockResponse</text>

  <path class="reply" d="M375 945 H130"/>
  <text x="250" y="933" text-anchor="middle" class="small">resultado atualizado</text>
</svg>
