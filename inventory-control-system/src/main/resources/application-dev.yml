spring:
  # 🐘 Configuração PostgreSQL (Saldo Transacional e Ledger)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_NAME:inventory_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:abc123.A}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_POOL_MAX_SIZE:10}
      minimum-idle: ${POSTGRES_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000

  # 🍃 Configuração MongoDB (Catálogo de Produtos e Categorias)
  data:
    mongodb:
      # Conexão direta local sem autenticação na porta padrão 27017
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB_NAME:inventory_db}
      auto-index-creation: true

  # Logs de SQL do Hibernate / JPA
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Nível de Log detalhado para depuração
logging:
  level:
    com.inventory.control.system: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.hibernate.SQL: DEBUG