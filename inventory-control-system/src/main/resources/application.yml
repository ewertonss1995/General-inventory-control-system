server:
  port: 8081

spring:
  application:
    name: inventory-control-system
  # profiles:
  #   active: ${SPRING_PROFILES_ACTIVE:dev}

  # 🐘 Configuração PostgreSQL (Saldo Transacional e Ledger)
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST:localhost}:${POSTGRES_DB_PORT:5433}/${POSTGRES_DB_NAME:inventory_db}
    username: ${POSTGRES_DB_USERNAME:postgres}
    password: ${POSTGRES_DB_PASSWORD:SenhaSuperSegura123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${POSTGRES_DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # 🍃 Configuração MongoDB (Catálogo de Produtos e Categorias)
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:admin}:${MONGO_PASSWORD:SenhaSuperSegura123!}@${MONGO_HOST:localhost}:${MONGO_PORT:27018}/${MONGO_DB_NAME:inventory_db}?authSource=${MONGO_AUTH_DB:admin}
      auto-index-creation: true

  # ✈️ Migration PostgreSQL
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 📊 Observabilidade
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # 100% de amostragem de rastros
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317} # Endpoint onde o Grafana Tempo recebe rastros OTLP
  prometheus:
    metrics:
      export:
        enabled: true

# Configuração do padrão do Log no Console
logging:
  pattern: 
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    
# 🔐 JWT
jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:certs/app.pub}