server:
  port: 8081

spring:
  application:
    name: inventory-control-system
    
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:product_db};encrypt=true;trustServerCertificate=true;
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:YourStrong@Password123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect