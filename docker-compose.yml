services:
  postgres-db:
    image: postgres:15-alpine
    container_name: inventory_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SenhaSuperSegura123!
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    networks:
      - inventory-network

  mongodb:
    image: mongo:7.0
    container_name: inventory_mongodb
    environment:
      MONGO_INITDB_DATABASE: inventory_db
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SenhaSuperSegura123!
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping: 1})' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mongo_data:/data/db
    networks:
      - inventory-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_DB_HOST=postgres-db
      - POSTGRES_DB_NAME=auth_db
      - POSTGRES_DB_USERNAME=postgres
      - POSTGRES_DB_PASSWORD=SenhaSuperSegura123!
      - POSTGRES_DB_PORT=5432
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres-db:
        condition: service_healthy   
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 210s
    networks:
      - inventory-network

  inventory-control-system:
    build:
      context: ./inventory-control-system
      dockerfile: Dockerfile
    container_name: inventory-control-system
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_DB_HOST=postgres-db
      - POSTGRES_DB_NAME=inventory_db
      - POSTGRES_DB_USERNAME=postgres
      - POSTGRES_DB_PASSWORD=SenhaSuperSegura123!
      - POSTGRES_DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=admin
      - MONGO_PASSWORD=SenhaSuperSegura123!
      - MONGO_DB_NAME=inventory_db
      - MONGO_AUTH_DB=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 210s
    networks:
      - inventory-network

  inventory-control-web-system:
    build:
      context: ./inventory-control-web-system
      dockerfile: Dockerfile
    container_name: inventory-control-web-system
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8082
      - INVENTORY_CONTROL_SYSTEM_URL=http://inventory-control-system:8081
    depends_on:
      auth-service:
        condition: service_healthy
      inventory-control-system:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - inventory-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: inventory-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: inventory-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=SenhaSuperSegura123!
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  grafana_data: