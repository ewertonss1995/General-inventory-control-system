services:
  auth-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Password123", "-Q", "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'product_db') CREATE DATABASE product_db; SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_data:/var/opt/mssql
    networks:
      - inventory-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://auth-db:1433;databaseName=master;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourStrong@Password123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - inventory-network

  inventory-control-system:
    build:
      context: ./inventory-control-system
      dockerfile: Dockerfile
    container_name: inventory-control-system
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=auth-db
      - DB_NAME=product_db
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Password123
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - inventory-network

  inventory-control-web-system:
    build:
      context: ./inventory-control-web-system
      dockerfile: Dockerfile
    container_name: inventory-control-web-system
    ports:
      - "8081:8081"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8080
      - PRODUCT_SERVICE_URL=http://inventory-control-system:8082
    depends_on:
      - auth-service
      - inventory-control-system
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  auth_db_data: