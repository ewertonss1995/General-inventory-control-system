services:
  postgres-db:
    image: postgres:15-alpine
    container_name: inventory_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SenhaSuperSegura123!
      - POSTGRES_DB=auth_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db && psql -U postgres -d auth_db -c \"SELECT 1 FROM pg_database WHERE datname = 'inventory_db'\" | grep -q 1 || psql -U postgres -d auth_db -c \"CREATE DATABASE inventory_db;\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-network

  mongodb:
    image: mongo:7.0
    container_name: inventory_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: inventory_db
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SenhaSuperSegura123!
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "SenhaSuperSegura123!", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db
    networks:
      - inventory-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=auth_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=SenhaSuperSegura123!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres-db:
        condition: service_healthy
      
    networks:
      - inventory-network

  inventory-control-system:
    build:
      context: ./inventory-control-system
      dockerfile: Dockerfile
    container_name: inventory-control-system
    ports:
      - "8081:8081"
    environment:
      # Variáveis do Postgres
      - POSTGRES_DB_HOST=postgres-db
      - POSTGRES_DB_NAME=inventory_db
      - POSTGRES_DB_USERNAME=postgres
      - POSTGRES_DB_PASSWORD=SenhaSuperSegura123!
      - POSTGRES_DB_PORT=5432
      # Variáveis do MongoDB
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=admin
      - MONGO_PASSWORD=SenhaSuperSegura123!
      - MONGO_DB_NAME=inventory_db
      - MONGO_AUTH_DB=admin
      # Configurações do Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - inventory-network

  inventory-control-web-system:
    build:
      context: ./inventory-control-web-system
      dockerfile: Dockerfile
    container_name: inventory-control-web-system
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8082
      - INVENTORY_CONTROL_SYSTEM_URL=http://inventory-control-system:8081
    depends_on:
      - auth-service
      - inventory-control-system
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
