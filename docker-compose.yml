version: '3.8'

services:
  # Banco de Dados SQL Server para o Auth Service
  auth-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123 # SQL Server exige senhas fortes (letras, números e símbolos)
    ports:
      - "1433:1433"
    healthcheck:
      # Comando específico para verificar se o SQL Server está pronto para receber conexões
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Password123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_data:/var/opt/mssql
    networks:
      - inventory-network

  # Microsserviço de Autenticação (Porta 8080)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      # URL JDBC corrigida para SQL Server (usando o DNS interno 'auth-db')
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://auth-db:1433;databaseName=master;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourStrong@Password123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - inventory-network

  # Backend-For-Frontend Web (Porta 8081)
  bff-web:
    build:
      context: ./inventory-control-web-system
      dockerfile: Dockerfile
    container_name: bff-web
    ports:
      - "8081:8081"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8080
    depends_on:
      - auth-service
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  auth_db_data:
