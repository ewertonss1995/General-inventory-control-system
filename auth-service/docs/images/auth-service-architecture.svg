<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="600" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#E2E8F0">Auth Service - Arquitetura</text>
  <text x="600" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#94A3B8">Microsserviço de autenticação, autorização e geração de JWT</text>

  <rect x="60" y="150" width="220" height="180" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="170" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#F8FAFC">Client</text>
  <text x="170" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#CBD5E1">Frontend</text>
  <text x="170" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#CBD5E1">BFF / Apps</text>
  <text x="170" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#38BDF8">HTTP / REST</text>

  <rect x="360" y="150" width="260" height="180" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="490" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#F8FAFC">Auth API</text>
  <text x="490" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#CBD5E1">AuthController</text>
  <text x="490" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#CBD5E1">Login / Register</text>
  <text x="490" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#CBD5E1">JWT validation</text>
  <text x="490" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#38BDF8">Spring Boot 3</text>

  <rect x="700" y="150" width="250" height="180" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="825" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#F8FAFC">Domain Layer</text>
  <text x="825" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#CBD5E1">RegisterUserService</text>
  <text x="825" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#CBD5E1">LoginUserService</text>
  <text x="825" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#CBD5E1">TokenService</text>
  <text x="825" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#38BDF8">Business rules</text>

  <rect x="430" y="430" width="340" height="180" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="600" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#F8FAFC">Data & Security</text>
  <text x="600" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">PostgreSQL</text>
  <text x="600" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">BCrypt password encoder</text>
  <text x="600" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">RSA public/private keys</text>
  <text x="600" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#38BDF8">JWT / Flyway / JPA</text>

  <rect x="920" y="430" width="200" height="180" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <text x="1020" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#F8FAFC">Ops</text>
  <text x="1020" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">Actuator</text>
  <text x="1020" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">Prometheus</text>
  <text x="1020" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">OpenTelemetry</text>
  <text x="1020" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#38BDF8">Monitoring</text>

  <path d="M280 240H360" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M620 240H700" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M825 330V430" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 330V430" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M770 430H900" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
</svg>
