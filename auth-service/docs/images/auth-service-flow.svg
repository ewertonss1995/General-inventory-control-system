<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg2)"/>

  <text x="600" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#E2E8F0">Fluxo da Autenticação</text>

  <rect x="50" y="120" width="170" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="135" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#F8FAFC">Cliente</text>
  <text x="135" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">Frontend / BFF</text>

  <rect x="320" y="120" width="190" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="415" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#F8FAFC">AuthController</text>
  <text x="415" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">/v1/auth/login</text>

  <rect x="620" y="120" width="220" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="730" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#F8FAFC">Domain Services</text>
  <text x="730" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">Validação + hash + JWT</text>

  <rect x="930" y="120" width="210" height="120" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="1035" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#F8FAFC">Persistence</text>
  <text x="1035" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#CBD5E1">PostgreSQL</text>

  <path d="M220 180H320" stroke="url(#accent2)" stroke-width="5" stroke-linecap="round"/>
  <path d="M510 180H620" stroke="url(#accent2)" stroke-width="5" stroke-linecap="round"/>
  <path d="M840 180H930" stroke="url(#accent2)" stroke-width="5" stroke-linecap="round"/>

  <rect x="100" y="300" width="1000" height="360" rx="20" fill="#0F172A" stroke="#334155"/>

  <text x="170" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#F8FAFC">1. Requisição</text>
  <text x="170" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">POST /v1/auth/login com username/email + senha</text>

  <text x="470" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#F8FAFC">2. Validação</text>
  <text x="470" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Valida payload, busca usuário e compara senha</text>

  <text x="770" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#F8FAFC">3. Token</text>
  <text x="770" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Gera JWT com chave privada e retorna Bearer</text>

  <path d="M200 420C330 420 330 420 340 420" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M415 420C520 420 520 420 620 420" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M730 420C820 420 820 420 930 420" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M1035 420V500" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M1035 500C1035 560 680 560 660 560" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M660 560C500 560 330 560 220 560" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M220 560V520" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

  <rect x="140" y="490" width="150" height="70" rx="12" fill="#0F766E" fill-opacity="0.9"/>
  <text x="215" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ECFEFF">200 OK</text>

  <rect x="620" y="480" width="220" height="100" rx="14" fill="#312E81" fill-opacity="0.9"/>
  <text x="730" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#E0E7FF">JWT Bearer</text>
  <text x="730" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#C7D2FE">Token de acesso</text>
</svg>
