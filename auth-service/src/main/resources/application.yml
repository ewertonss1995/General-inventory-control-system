server:
  port: 8082

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:auth_db};encrypt=true;trustServerCertificate=true;
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:SenhaSuperSegura123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

# Configurações do Spring Security Actuator e Exposições de Métricas
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# Swagger / OpenAPI customizado para o time de desenvolvimento
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Chaves RSA Privada/Pública para assinatura dos Tokens JWT
jwt:
  private-key-path: classpath:certs/app.key
  public-key-path: classpath:certs/app.pub