<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Amazon DocumentDB</title>
  <desc id="desc">Diagrama mostrando VPC, subnets privadas, grupo de subnets para DocumentDB, cluster e instância isolados em rede interna.</desc>

  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .label { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #2f80ed; stroke-width: 2; rx: 16; }
      .private { fill: #eef6ff; stroke: #3b82f6; stroke-width: 2; rx: 16; }
      .cluster { fill: #f3e8ff; stroke: #8b5cf6; stroke-width: 2; rx: 18; }
      .instance { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 16; }
      .security { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; rx: 16; }
      .line { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
      .dashed { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
      .vpc { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
    </style>
  </defs>

  <rect x="40" y="40" width="1120" height="620" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" class="title">Amazon DocumentDB</text>
  <text x="600" y="120" text-anchor="middle" class="subtitle">Arquitetura em subnets privadas da VPC</text>

  <rect x="110" y="170" width="980" height="410" rx="26" class="vpc"/>
  <text x="600" y="205" text-anchor="middle" class="label">VPC principal - 10.0.0.0/16</text>

  <rect x="170" y="250" width="390" height="250" rx="20" class="private"/>
  <text x="365" y="286" text-anchor="middle" class="label">Private Subnet A</text>
  <text x="365" y="312" text-anchor="middle" class="small">10.0.10.0/24</text>

  <rect x="640" y="250" width="390" height="250" rx="20" class="private"/>
  <text x="835" y="286" text-anchor="middle" class="label">Private Subnet B</text>
  <text x="835" y="312" text-anchor="middle" class="small">10.0.11.0/24</text>

  <rect x="430" y="338" width="340" height="118" rx="20" class="cluster"/>
  <text x="600" y="382" text-anchor="middle" class="label">DocumentDB Cluster</text>
  <text x="600" y="406" text-anchor="middle" class="small">aws_docdb_cluster.docdb</text>
  <text x="600" y="428" text-anchor="middle" class="small">Porta 27017</text>

  <rect x="510" y="490" width="180" height="66" rx="16" class="instance"/>
  <text x="600" y="525" text-anchor="middle" class="label">Instância</text>
  <text x="600" y="548" text-anchor="middle" class="small">db.t3.medium</text>

  <rect x="285" y="202" width="220" height="56" rx="12" class="security"/>
  <text x="395" y="236" text-anchor="middle" class="label">Subnet Group</text>
  <text x="395" y="254" text-anchor="middle" class="small">aws_docdb_subnet_group</text>

  <rect x="690" y="202" width="250" height="56" rx="12" class="security"/>
  <text x="815" y="236" text-anchor="middle" class="label">Security Group</text>
  <text x="815" y="254" text-anchor="middle" class="small">docdb_security_group_id</text>

  <path d="M 500 232 L 462 232" class="line"/>
  <path d="M 700 232 L 738 232" class="line"/>
  <path d="M 600 338 L 600 304" class="line"/>
  <path d="M 600 456 L 600 490" class="line"/>

  <path d="M 335 320 L 430 338" class="line"/>
  <path d="M 865 320 L 770 338" class="line"/>

  <path d="M 120 440 C 210 440, 260 440, 285 440" class="dashed"/>
  <path d="M 1080 440 C 990 440, 940 440, 915 440" class="dashed"/>

  <text x="600" y="610" text-anchor="middle" class="small">Acesso restrito à aplicação e ao cluster na rede privada, sem exposição direta à internet.</text>
</svg>
